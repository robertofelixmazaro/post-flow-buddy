<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendasaas - Agendador de Posts para Redes Sociais</title>
    <meta name="description" content="Agende posts para múltiplas redes sociais, visualize seu calendário editorial e otimize horários de publicação. Instagram, Facebook, Twitter e LinkedIn." />
    <meta name="author" content="Agendasaas" />
    <meta name="theme-color" content="#02f71f" />

    <meta property="og:title" content="Agendasaas - Agendador de Posts" />
    <meta property="og:description" content="Agende posts para múltiplas redes sociais e otimize sua presença digital." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@agendasaas" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
  </head>

  <body>
    <div id="fb-root"></div>
    <script>
      // Facebook App ID - this is a PUBLIC value, safe to include here
      window.__FB_APP_ID__ = '681638807610238';
      
      window.fbAsyncInit = function() {
        if (window.FB && window.__FB_APP_ID__) {
          FB.init({
            appId: window.__FB_APP_ID__,
            cookie: true,
            xfbml: true,
            version: 'v18.0'
          });
          FB.AppEvents.logPageView();
          console.log('Facebook SDK initialized with App ID:', window.__FB_APP_ID__);
          window.dispatchEvent(new Event('fb-sdk-ready'));
        }
      };
      (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) { return; }
        js = d.createElement(s); js.id = id;
        js.src = "https://connect.facebook.net/pt_BR/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'facebook-jssdk'));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
