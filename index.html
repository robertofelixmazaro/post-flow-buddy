<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda Plus - Agendamento inteligente de posts</title>
    <meta name="description" content="Agenda Plus: plataforma de agendamento inteligente de posts para Facebook, Instagram, TikTok e LinkedIn, com calendário editorial." />
    <meta name="author" content="Agenda Plus" />
    <meta name="theme-color" content="#0d1117" />

    <meta property="og:title" content="Agenda Plus - Agendamento inteligente" />
    <meta property="og:description" content="Plataforma de agendamento de posts para Facebook, Instagram, TikTok e LinkedIn." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agenda Plus - Agendamento inteligente" />
    <meta name="twitter:description" content="Plataforma de agendamento de posts para Facebook, Instagram, TikTok e LinkedIn." />
  </head>

  <body>
    <div id="fb-root"></div>
    <script>
      // Loads the Facebook JS SDK only. Initialization (FB.init) happens in the app
      // with the App ID provided by the backend configuration.
      window.fbAsyncInit = function() {
        window.dispatchEvent(new Event('fb-sdk-ready'));
      };
      (function(d, s, id) {
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) { return; }
        js = d.createElement(s); js.id = id;
        js.src = "https://connect.facebook.net/pt_BR/sdk.js";
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'facebook-jssdk'));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
